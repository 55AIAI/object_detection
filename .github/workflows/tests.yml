name: Vision checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-core.txt
      - run: python -m unittest discover -s tests -v
      - run: python yolo.py --help
      - run: python yolo.py --demo --headless --output output/demo.mp4 --report output/demo.json
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: synthetic-demo
          path: output/
          retention-days: 7
  model-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOLO_AUTOINSTALL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install "torch>=2.6,<3" "torchvision>=0.21,<1" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt "lap>=0.5.12"
      - run: python -m pip check
      - run: python -m tests.model_smoke
      - run: python -m pip freeze > installed-versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: model-environment
          path: installed-versions.txt
          retention-days: 7
